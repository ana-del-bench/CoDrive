services:
  db:
    image: imresamu/postgis:16-3.4-bookworm
    environment:
      POSTGRES_USER: codrive
      POSTGRES_PASSWORD: codrive
      POSTGRES_DB: codrive
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codrive -d codrive"]
      interval: 5s
      timeout: 5s
      retries: 10
